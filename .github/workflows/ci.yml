name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format (pinned to match local)
        run: pipx install clang-format==20.1.0
      - name: Install websockets (smoke test client)
        run: python3 -m pip install websockets
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: WebSocket smoke test
        run: python3 server/test_ws_smoke.py
